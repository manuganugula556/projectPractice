<section class="login-page">

  <div class="login-card">

<!-- =========================
     LOGIN HEADER
========================= -->

<div class="login-header">

  <div
    class="login-logo"
    aria-hidden="true"
  >
    AM
  </div>

  <h1>
    Admin Login
  </h1>

  <p>
    Sign in to manage the GAPCO gallery.
  </p>

</div>


<!-- =========================
     LOGIN FORM
========================= -->

<form
  #loginForm="ngForm"
  (ngSubmit)="login()"
  novalidate
>

  <!-- =========================
       EMAIL
  ========================= -->

  <div class="form-group">

    <label for="login-email">
      Email Address
    </label>

    <input
      id="login-email"
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter admin email"
      autocomplete="username"
      maxlength="254"
      required
    />

  </div>


  <!-- =========================
       PASSWORD
  ========================= -->

  <div class="form-group">

    <label for="login-password">
      Password
    </label>

    <div class="password-wrapper">

      <input
        id="login-password"
        [type]="showPassword ? 'text' : 'password'"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter password"
        autocomplete="current-password"
        maxlength="128"
        required
      />

      <button
        type="button"
        class="password-eye"
        (click)="togglePassword()"
        [attr.aria-label]="
          showPassword
            ? 'Hide password'
            : 'Show password'
        "
        [attr.aria-pressed]="showPassword"
      >
        @if (showPassword) {
          <svg
            class="password-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
            <circle cx="12" cy="12" r="2.75"></circle>
          </svg>
        } @else {
          <svg
            class="password-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path d="m3 3 18 18"></path>
            <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17.7 17.7 0 0 1-3.2 3.8"></path>
            <path d="M6.2 6.3C3.8 8 2.5 12 2.5 12S6 19 12 19c1.2 0 2.3-.2 3.3-.6"></path>
          </svg>
        }
      </button>

    </div>

  </div>


  <!-- =========================
       ERROR MESSAGE
  ========================= -->

  @if (errorMessage) {

    <div
      class="error-message"
      role="alert"
    >
      {{ errorMessage }}
    </div>

  }


  <!-- =========================
       LOGIN BUTTON
  ========================= -->

  <button
    type="submit"
    [disabled]="isLoading"
    [attr.aria-busy]="isLoading"
  >

    @if (isLoading) {

      Signing in...

    } @else {

      Sign In

    }

  </button>

</form>

  </div>

</section>
