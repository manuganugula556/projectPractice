<section class="login-page">

  <div class="login-card">

<!-- =========================
     LOGIN HEADER
========================= -->

<div class="login-header">

  <div
    class="login-logo"
    aria-hidden="true"
  >
    AM
  </div>

  <h1>
    Admin Login
  </h1>

  <p>
    Sign in to manage the GAPCO gallery.
  </p>

</div>


<!-- =========================
     LOGIN FORM
========================= -->

<form
  #loginForm="ngForm"
  (ngSubmit)="login()"
  novalidate
>

  <!-- =========================
       EMAIL
  ========================= -->

  <div class="form-group">

    <label for="login-email">
      Email Address
    </label>

    <input
      id="login-email"
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter admin email"
      autocomplete="username"
      maxlength="254"
      required
    />

  </div>


  <!-- =========================
       PASSWORD
  ========================= -->

  <div class="form-group">

    <label for="login-password">
      Password
    </label>

    <div class="password-wrapper">

      <input
        id="login-password"
        [type]="showPassword ? 'text' : 'password'"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter password"
        autocomplete="current-password"
        maxlength="128"
        required
      />

      <button
        type="button"
        class="password-eye"
        (click)="togglePassword()"
        [attr.aria-label]="
          showPassword
            ? 'Hide password'
            : 'Show password'
        "
        [attr.aria-pressed]="showPassword"
      >
        {{ showPassword ? '👁' : '/' }}
      </button>

    </div>

  </div>


  <!-- =========================
       ERROR MESSAGE
  ========================= -->

  @if (errorMessage) {

    <div
      class="error-message"
      role="alert"
    >
      {{ errorMessage }}
    </div>

  }


  <!-- =========================
       LOGIN BUTTON
  ========================= -->

  <button
    type="submit"
    [disabled]="isLoading"
    [attr.aria-busy]="isLoading"
  >

    @if (isLoading) {

      Signing in...

    } @else {

      Sign In

    }

  </button>

</form>

  </div>

</section>
